<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#grad1)"/>
  
  <!-- Calculator display -->
  <rect x="15" y="15" width="70" height="20" rx="3" ry="3" fill="#f8f9fa"/>
  <text x="80" y="29" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">0</text>
  
  <!-- Calculator buttons grid -->
  <g fill="#ecf0f1">
    <rect x="15" y="42" width="14" height="10" rx="2" ry="2"/>
    <rect x="32" y="42" width="14" height="10" rx="2" ry="2"/>
    <rect x="49" y="42" width="14" height="10" rx="2" ry="2"/>
    <rect x="66" y="42" width="19" height="10" rx="2" ry="2" fill="#3498db"/>
    
    <rect x="15" y="55" width="14" height="10" rx="2" ry="2"/>
    <rect x="32" y="55" width="14" height="10" rx="2" ry="2"/>
    <rect x="49" y="55" width="14" height="10" rx="2" ry="2"/>
    <rect x="66" y="55" width="19" height="10" rx="2" ry="2" fill="#3498db"/>
    
    <rect x="15" y="68" width="14" height="10" rx="2" ry="2"/>
    <rect x="32" y="68" width="14" height="10" rx="2" ry="2"/>
    <rect x="49" y="68" width="14" height="10" rx="2" ry="2"/>
    <rect x="66" y="68" width="19" height="10" rx="2" ry="2" fill="#3498db"/>
    
    <rect x="15" y="81" width="31" height="10" rx="2" ry="2"/>
    <rect x="49" y="81" width="14" height="10" rx="2" ry="2"/>
    <rect x="66" y="81" width="19" height="10" rx="2" ry="2" fill="#e74c3c"/>
  </g>
  
  <!-- Plus symbol on equals button -->
  <text x="75.5" y="89" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">=</text>
</svg>
